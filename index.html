<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cuolega - Recruitment Site / Internal Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@500;600&display=swap">
<style>
/* ============================================================
   参照：proto-review-vict0a.pages.dev の索引ページ実測値
   wrap 1080 / padding 128-32-160 ／ 3列 325.33 + gap 20
   h1 Inter 30/600/0.03em ／ h2 Inter 12/600/0.22em uppercase
   card #fafafa r12 padding 44-32-40 ／ name Inter 11/600/0.24em
   ============================================================ */
:root{
  --ink:#111112;
  --muted:#6b6b70;
  --line:rgba(17,17,18,.12);
  --paper:#ffffff;
  --card:#fafafa;
  --card-hover:#f2f2f2;
  --font-ja:"Noto Sans JP",-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
  --font-en:"Inter",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ja);font-size:16px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

.wrap{max-width:1080px;margin:0 auto;padding:128px 32px 160px}

h1{font-family:var(--font-en);font-size:30px;font-weight:600;letter-spacing:.03em;line-height:1.2;margin:0 0 96px}
/* Internal バッジ：Figma 587:12505（A/N-900 #42423F / 角丸2px / 115×22） */
.badge{
  display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;
  margin-left:16px;width:115px;height:22px;border-radius:2px;background:#42423f;
  font-family:var(--font-en);font-size:11px;font-weight:500;letter-spacing:.18em;
  color:#fff;
}

.stage + .stage{margin-top:96px}
.stage h2{
  font-family:var(--font-en);font-size:12px;font-weight:600;letter-spacing:.22em;
  text-transform:uppercase;margin:0 0 28px;
}

/* ---- カード ---- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{
  background:var(--card);border-radius:12px;padding:44px 32px 40px;
  min-height:272px;display:flex;flex-direction:column;
  transition:background-color .5s var(--ease),transform .5s var(--ease);
}
a.card:hover{background:var(--card-hover);transform:translateY(-2px)}
.card .name{
  font-family:var(--font-en);font-size:11px;font-weight:600;letter-spacing:.24em;
  color:var(--muted);margin:0 0 14px;
}
.card .policy{font-size:13.5px;letter-spacing:.03em;line-height:1.6;margin:0;font-weight:500}
.card .meta{font-size:12px;letter-spacing:.03em;line-height:1.8;color:var(--muted);margin:6px 0 0}
.card .links{display:flex;gap:20px;margin-top:auto;padding-top:32px}
.card .links a,.card .go{
  display:inline-flex;align-items:center;gap:8px;padding:2px 0;
  font-family:var(--font-en);font-size:15px;font-weight:600;letter-spacing:.08em;
}
.card .links .go.is-off{color:var(--muted)}
.arrow{display:inline-flex;transition:transform .5s var(--ease)}
a.card:hover .arrow,.card .links a:hover .arrow{transform:translateX(4px)}

@media (max-width:860px){
  .wrap{padding:72px 20px 96px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="stage">
    <h1>Cuolega - Recruitment Site<span class="badge">Internal</span></h1>
  </header>

  <!-- ================= WIREFRAME ================= -->
  <!-- 採用まわりは3ページ立て。1が親、2・3がその下にぶら下がる特設 -->
  <section class="stage">
    <h2>Wireframe</h2>
    <div class="grid">

      <div class="card">
        <p class="name">Wireframe 01</p>
        <p class="policy">採用サイト</p>
        <p class="meta">コーポレートサイトから紐付く親の採用サイト<br>未着手</p>
        <div class="links"><span class="go is-off">Not ready</span></div>
      </div>

      <div class="card">
        <p class="name">Wireframe 02</p>
        <p class="policy">営業特設ページ</p>
        <p class="meta">営業職向けの特設ページ<br>未着手</p>
        <div class="links"><span class="go is-off">Not ready</span></div>
      </div>

      <div class="card">
        <p class="name">Wireframe 03</p>
        <p class="policy">新卒特設ページ</p>
        <p class="meta">13 sections / PC 1440px<br>C案の設計値に準拠（余白134・字送り0.1em）</p>
        <div class="links">
          <a href="v2.html">V2
            <span class="arrow" aria-hidden="true"><svg viewBox="0 0 14 12" width="11" height="9" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0.8 6h11.2M8 1.4l4.6 4.6-4.6 4.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </a>
          <a href="v1.html">V1
            <span class="arrow" aria-hidden="true"><svg viewBox="0 0 14 12" width="11" height="9" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0.8 6h11.2M8 1.4l4.6 4.6-4.6 4.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </a>
        </div>
      </div>

    </div>
  </section>

</div>
</body>
</html>
