<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スマホ版プレビュー｜Cuolega セールス採用特設</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&family=Lato:wght@400;700&display=swap">
<style>
/* PC の画面の真ん中に、スマホ幅の窓をひとつ置くための台。
   中身は iframe に入れる。CSS で幅を絞るだけでは、メディアクエリが
   見ているのは「ブラウザの幅」なのでスマホ用の指定が効かない。
   iframe なら中が本物の 390px ビューポートになるので、実機と同じ
   条件で組みが切り替わる。 */
:root{
  --stage:#26262a;      /* 両サイドのダークグレー */
  --stage-2:#1c1c1f;
  --chrome:#f2f2f4;
  --line:rgba(255,255,255,.16);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--stage);
  color:var(--chrome);
  font-family:"Noto Sans JP",-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
  font-size:13px;
  display:flex;flex-direction:column;
  overflow:hidden;               /* スクロールするのは中の画面だけ */
}

/* 上の細い操作帯。幅を切り替えられるようにしておく。実機は 375〜430 に
   散らばるので、1つの幅だけ見ても収まりの判断ができない。 */
.bar{
  flex:none;display:flex;align-items:center;gap:20px;
  height:52px;padding:0 20px;
  background:var(--stage-2);border-bottom:1px solid var(--line);
}
.bar h1{
  margin:0;font-family:"Lato",sans-serif;font-weight:700;
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.7);white-space:nowrap;
}
.sizes{display:flex;gap:6px;margin-left:auto}
.sizes button{
  appearance:none;border:1px solid var(--line);background:transparent;
  color:rgba(255,255,255,.66);
  height:28px;padding:0 12px;border-radius:999px;cursor:pointer;
  font-family:"Lato",sans-serif;font-size:11px;letter-spacing:.06em;
  transition:background-color .25s ease,color .25s ease,border-color .25s ease;
}
.sizes button:hover{color:#fff;border-color:rgba(255,255,255,.4)}
.sizes button[aria-pressed="true"]{background:#fff;border-color:#fff;color:#141416}
.note{color:rgba(255,255,255,.4);font-size:11px;letter-spacing:.04em;white-space:nowrap}

/* 画面の中央に窓を置く。上下は少しだけ余白を残して、
   端末の中に収まっている感じを出す。 */
.stage{
  flex:1;min-height:0;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.device{
  position:relative;
  width:var(--w,390px);
  height:100%;
  max-width:100%;
  border-radius:18px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 24px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08);
  transition:width .35s cubic-bezier(.16,1,.3,1);
}
.device iframe{
  display:block;width:100%;height:100%;border:0;
}
/* 窓の幅の表示。中身に重ならないよう、外の下側へ置く */
.caption{
  flex:none;text-align:center;padding:0 0 14px;
  color:rgba(255,255,255,.38);font-family:"Lato",sans-serif;
  font-size:11px;letter-spacing:.12em;
}

/* 画面が狭いときは台を出さず、中身をそのまま見せたほうが早い */
@media (max-width:820px){
  body{overflow:auto}
  .bar{position:sticky;top:0;z-index:2}
  .stage{padding:0}
  .device{width:100%;height:auto;min-height:100vh;border-radius:0;box-shadow:none}
  .device iframe{height:100vh}
  .sizes{display:none}
}
</style>
</head>
<body>

<div class="bar">
  <h1>Cuolega Sales — SP Preview</h1>
  <span class="note">中はスクロールできます</span>
  <div class="sizes" role="group" aria-label="画面幅">
    <button type="button" data-w="375" aria-pressed="false">375</button>
    <button type="button" data-w="390" aria-pressed="true">390</button>
    <button type="button" data-w="430" aria-pressed="false">430</button>
  </div>
</div>

<div class="stage">
  <div class="device" id="device" style="--w:390px">
    <iframe id="frame" src="sales.html" title="スマホ版プレビュー"></iframe>
  </div>
</div>

<p class="caption" id="cap">390 × 端末の高さ</p>

<script>
(function(){
  var dev=document.getElementById('device'),
      cap=document.getElementById('cap'),
      btns=[].slice.call(document.querySelectorAll('.sizes button'));
  function set(w){
    dev.style.setProperty('--w', w+'px');
    cap.textContent = w + ' × 端末の高さ';
    btns.forEach(function(b){
      b.setAttribute('aria-pressed', String(b.dataset.w === String(w)));
    });
  }
  btns.forEach(function(b){
    b.addEventListener('click', function(){ set(+b.dataset.w); });
  });
})();
</script>

</body>
</html>
